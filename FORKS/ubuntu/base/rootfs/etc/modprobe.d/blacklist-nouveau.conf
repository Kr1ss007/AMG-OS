# ==============================================================================
# AMGOS Hardware Enablement Policy (SPEC Section 2.2 & SPEC Section 10)
# Force disable open-source nouveau driver to ensure the proprietary NVIDIA
# driver initializes direct GPU discrete mode without kernel framebuffer collisions.
# ==============================================================================

blacklist nouveau
blacklist lbm-nouveau
options nouveau modeset=0
alias nouveau off
alias lbm-nouveau off
